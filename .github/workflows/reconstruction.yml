name: r!z3 reconstruction checks

on:
  pull_request:
    branches: [feat/classic-riz3-cv2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riz3_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: riz3_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riz3_test -d riz3_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA_DIR: /tmp/riz3-test-data
      DATABASE_URL: ""
      DISCORD_TOKEN: ""
      TEST_DATABASE_URL: postgresql://riz3_test:ci-test-only@127.0.0.1:5432/riz3_bridge_test
      ALLOW_LOCAL_TEST_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r control_center/requirements.txt pgserver==0.1.4
      - name: Run full suite including real PostgreSQL tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconstruction-test-results
          path: test-results.xml
          if-no-files-found: warn

  panel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build Control Center
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm run build
